<input

id="constructionArea"

<input
type="number"
id="openArea"

type="text"

"Uttarakhand":50,

function updateAQI(){

let state =
document.getElementById("state").value;

let aqi =
stateAQI[state] || "N/A";

document.getElementById("aqi").value =
aqi;

}
updateAQI();

document.getElementById("state")
.addEventListener("change", updateAQI);

window.onload = function(){

updateAQI();
updateOpenArea();

};

document.getElementById("plotArea")
.addEventListener("input", updateOpenArea);

document.getElementById("constructionArea")
.addEventListener("input", updateOpenArea);

function updateOpenArea(){

let plot =
Number(document.getElementById("plotArea").value) || 0;

let construction =
Number(document.getElementById("constructionArea").value) || 0;

let openArea =
plot - construction;

if(openArea < 0){
openArea = 0;
}

document.getElementById("openArea").value =
openArea;

}
